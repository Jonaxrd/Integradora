<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hardware Scanner</title>

<style>

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --card-hover:#273549;
    --primary:#38bdf8;
    --text:#ffffff;
    --secondary:#94a3b8;
    --success:#22c55e;
    --warning:#f59e0b;
    --danger:#ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#020617,#0f172a);
    color:var(--text);
    min-height:100vh;
    padding:30px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:2.5rem;
    margin-bottom:10px;
}

header p{
    color:var(--secondary);
}

.btn-scan{
    display:block;
    margin:25px auto;
    padding:14px 35px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    color:#000;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn-scan:hover{
    transform:translateY(-2px);
}

#estado{
    text-align:center;
    margin-bottom:20px;
    color:var(--secondary);
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:20px;
}

.card{
    background:rgba(30,41,59,.9);
    border-radius:18px;
    padding:20px;
    border:1px solid rgba(255,255,255,.05);
    transition:.3s;
}

.card:hover{
    background:var(--card-hover);
}

.card h2{
    color:var(--primary);
    margin-bottom:15px;
    font-size:1.2rem;
}

.recomendacion{
    background:#334155;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
}

.detalle{
    display:block;
    margin-top:10px;
    color:#cbd5e1;
    line-height:1.6;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:.8rem;
    margin-bottom:10px;
}

.alta{
    background:#7f1d1d;
}

.media{
    background:#78350f;
}

.baja{
    background:#14532d;
}

</style>
</head>

<body>

<header>
    <h1>Hardware Scanner</h1>
    <p>Diagnóstico y recomendaciones de actualización de hardware</p>
</header>

<button class="btn-scan" onclick="cargarResultados()">
Analizar Resultado
</button>

<div id="estado">
Esperando análisis...
</div>

<div class="dashboard">

<div class="card">
    <h2>Estado del sistema</h2>
    <div id="sistema"></div>
</div>

<div class="card">
    <h2>Presupuesto</h2>
    <div id="presupuesto"></div>
</div>

<div class="card">
    <h2>Recomendaciones</h2>
    <div id="recomendaciones"></div>
</div>

</div>

<script>

async function cargarResultados(){

    document.getElementById("estado").innerHTML =
    "Cargando resultados...";

    try{

        const response = await fetch("resultados.json");
        const data = await response.json();

        mostrarSistema(data.system_profile);
        mostrarPresupuesto(data.budget);
        mostrarRecomendaciones(data.recommendations);

        document.getElementById("estado").innerHTML =
        "Análisis cargado correctamente";

    }catch(error){

        document.getElementById("estado").innerHTML =
        "No se pudo cargar resultados.json";

        console.error(error);
    }
}


function mostrarSistema(profile){

    document.getElementById("sistema").innerHTML = `

        <div class="recomendacion">

            <div class="badge media">
                Sistema
            </div>

            <strong>Nivel:</strong> ${profile.level}
            <br><br>

            ${profile.use}
            <br>
            ${profile.gaming}
            <br><br>

            ${profile.recommendation}

        </div>
    `;
}


function mostrarPresupuesto(budget){

    document.getElementById("presupuesto").innerHTML = `

        <div class="recomendacion">

            <div class="badge media">
                Presupuesto actual
            </div>

            <strong>$${budget} MXN</strong>

        </div>
    `;
}


function mostrarRecomendaciones(recs){

    let html = "";

    recs.forEach(r => {

        let badge = "baja";

        if (r.priority >= 9) badge = "alta";
        else if (r.priority >= 7) badge = "media";

        html += `
            <div class="recomendacion">

                <div class="badge ${badge}">
                    ${r.component}
                </div>

                <strong>${r.suggestion}</strong>

                <div class="detalle">
                    ${r.impact}
                    <br><br>
                    ${r.cost ? "$" + r.cost : "Sin costo"}
                </div>

            </div>
        `;
    });

    document.getElementById("recomendaciones").innerHTML = html;
}

</script>

</body>
</html>
